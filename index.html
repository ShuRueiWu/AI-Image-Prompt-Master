ortrait focal length. Beautiful compression and bokeh."},{label:"\u9577\u7126\u93E1\u982D (Telephoto)",val:"Telephoto Lens",desc:"\u58D3\u7E2E\u7A7A\u9593\u611F\uFF0C\u4F7F\u524D\u5F8C\u666F\u770B\u8D77\u4F86\u66F4\u8CBC\u8FD1\uFF0C\u80CC\u666F\u6A21\u7CCA\u6548\u679C\u5F37\u3002",desc_en:"Compresses space. Makes foreground/background look closer. Strong background blur."},{label:"\u5FAE\u8DDD (Macro)",val:"Macro Photography",desc:"\u6975\u8FD1\u8DDD\u96E2\u62CD\u651D\u5FAE\u5C0F\u7269\u9AD4\uFF0C\u5C55\u73FE\u7D30\u7BC0\u4E16\u754C\u3002",desc_en:"Extreme close-up. Reveals world of details."},{label:"\u6563\u666F (Bokeh)",val:"Bokeh",desc:"\u5229\u7528\u5927\u5149\u5708\u4F7F\u80CC\u666F\u6A21\u7CCA\u6210\u67D4\u7F8E\u7684\u5149\u6591\uFF0C\u7A81\u51FA\u4E3B\u9AD4\u3002",desc_en:"Uses large aperture to blur background into soft light spots. Highlights subject."},{label:"\u79FB\u8EF8\u651D\u5F71 (Tilt-Shift)",val:"Tilt-Shift",desc:"\u8B93\u771F\u5BE6\u5834\u666F\u770B\u8D77\u4F86\u50CF\u5FAE\u7E2E\u6A21\u578B\u73A9\u5177\u3002",desc_en:"Makes real scenes look like miniature toy models."},{label:"\u9577\u66DD\u5149 (Long Exposure)",val:"Long Exposure",desc:"\u6162\u5FEB\u9580\uFF0C\u8B93\u79FB\u52D5\u7684\u5149\u9EDE\u8B8A\u5149\u8ECC\uFF0C\u6D41\u6C34\u8B8A\u9727\u72C0\u3002",desc_en:"Slow shutter. Turns moving lights to trails, water to mist."},{label:"\u9AD8\u901F\u651D\u5F71 (High Speed)",val:"High Speed Photography",desc:"\u51CD\u7D50\u9AD8\u901F\u904B\u52D5\u77AC\u9593\uFF0C\u5982\u6C34\u6EF4\u98DB\u6FFA\u3001\u5B50\u5F48\u7A7F\u900F\u3002",desc_en:"Freezes high-speed moments like water splashes or bullet penetration."},{label:"\u92B3\u5229\u5C0D\u7126 (Sharp Focus)",val:"Sharp Focus",desc:"\u4E3B\u9AD4\u6E05\u6670\u92B3\u5229\u3002",desc_en:"Subject is clear and sharp."},{label:"\u67D4\u7126 (Soft Focus)",val:"Soft Focus",desc:"\u8F15\u5FAE\u6A21\u7CCA\u7684\u5922\u5E7B\u6548\u679C\uFF0C\u5E38\u7528\u65BC\u6D6A\u6F2B\u4EBA\u50CF\u3002",desc_en:"Slightly blurred dreamy effect. Often used for romantic portraits."},{label:"\u6293\u62CD (Candid)",val:"Candid",desc:"\u81EA\u7136\u3001\u4E0D\u7D93\u610F\u7684\u77AC\u9593\u6355\u6349\u3002",desc_en:"Natural, unposed moment capture."},{label:"Kodak Portra 400",val:"Kodak Portra 400",desc:"\u819A\u8272\u6EAB\u6F64\u81EA\u7136\uFF0C\u9846\u7C92\u7D30\u7DFB\uFF0C\u4EBA\u50CF\u9996\u9078\u3002",desc_en:"Warm, natural skin tones. Fine grain. Best for portraits."},{label:"Kodak Ektar 100",val:"Kodak Ektar 100",desc:"\u6975\u9AD8\u98FD\u548C\u5EA6\u8207\u92B3\u5229\u5EA6\uFF0C\u85CD\u5929\u8207\u7D05\u8272\u7279\u5225\u9BAE\u8C54\u3002",desc_en:"Ultra high saturation and sharpness. Vivid blues and reds."},{label:"Kodak Gold 200",val:"Kodak Gold 200",desc:"\u7D93\u5178\u6D88\u8CBB\u7D1A\u5E95\u7247\uFF0C\u6EAB\u6696\u91D1\u9EC3\u8272\u8ABF\uFF0C\u61F7\u820A\u611F\u5F37\u3002",desc_en:"Classic consumer film. Warm golden tones. Strong nostalgic feel."},{label:"Kodak Tri-X 400",val:"Kodak Tri-X 400",desc:"\u50B3\u5947\u9ED1\u767D\u5E95\u7247\uFF0C\u9AD8\u5C0D\u6BD4\u5EA6\uFF0C\u8C50\u5BCC\u7684\u7070\u968E\u5C64\u6B21\u3002",desc_en:"Legendary B&W film. High contrast with rich gray tones."},{label:"CineStill 800T",val:"CineStill 800T",desc:"\u96FB\u5F71\u5E95\u7247\u611F\uFF0C\u71C8\u5149\u5468\u570D\u6709\u7D05\u8272\u5149\u6688\uFF0C\u9069\u5408\u591C\u666F\u3002",desc_en:"Cinematic film look. Red halation around lights. Good for night scenes."},{label:"CineStill 50D",val:"CineStill 50D",desc:"\u65E5\u5149\u96FB\u5F71\u5E95\u7247\uFF0C\u8272\u5F69\u98FD\u548C\u7D30\u81A9\uFF0C\u9069\u5408\u6236\u5916\u3002",desc_en:"Daylight cinema film. Saturated and fine colors. Great for outdoors."},{label:"Fujifilm Pro 400H",val:"Fujifilm Pro 400H",desc:"\u65E5\u7CFB\u98A8\u683C\uFF0C\u8272\u8ABF\u504F\u51B7\u7C89\u5AE9\uFF0C\u7A7A\u6C23\u611F\u5F37\u3002",desc_en:"Japanese style. Cool, pastel tones. Airy feel."},{label:"Fujifilm Velvia 50",val:"Fujifilm Velvia 50",desc:"\u9AD8\u98FD\u548C\u6B63\u724
