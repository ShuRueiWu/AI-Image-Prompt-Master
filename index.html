    <script>
        window.onerror = function (message, source, lineno, colno, error) {
            var errorDiv = document.createElement('div');
            errorDiv.style.position = 'fixed';
            errorDiv.style.top = '0';
            errorDiv.style.left = '0';
            errorDiv.style.width = '100%';
            errorDiv.style.backgroundColor = 'rgba(220, 38, 38, 0.9)';
            errorDiv.style.color = 'white';
            errorDiv.style.padding = '1rem';
            errorDiv.style.zIndex = '9999';
            errorDiv.style.fontFamily = 'monospace';
            errorDiv.style.fontSize = '12px';
            errorDiv.innerHTML = '<strong>Error:</strong> ' + message + '<br/>' +
                '<strong>Source:</strong> ' + source + ':' + lineno;
            document.body.appendChild(errorDiv);
            console.error('Global Error:', message, source, lineno, error);
            return false;
        };
    </script>

    <style>
        :root {
            /* 背景色階 - Modern Slate Palette */
            --bg-primary: #0f172a;
            /* Slate 900 */
            --bg-secondary: #1e293b;
            /* Slate 800 */
            --bg-tertiary: #334155;
            /* Slate 700 */
            --bg-border: #475569;
            /* Slate 600 */

            /* 強調色 - Accent colors */
            --accent-primary: #3b82f6;
            /* Blue-500 */
            --accent-success: #10b981;
            /* Emerald-500 */
            --accent-warning: #f59e0b;
            /* Amber-500 */
            --accent-danger: #ef4444;
            /* Red-500 */
            --accent-purple: #8b5cf6;
            /* Violet-500 */

            /* 漸層效果 - Gradients */
            --gradient-header: linear-gradient(135deg, rgba(30, 58, 138, 0.8) 0%, rgba(15, 23, 42, 0.8) 100%);
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            overscroll-behavior-y: none;
            background-color: var(--bg-primary);
            color: #e2e8f0;
            /* Slate 200 */
        }

        /* Glassmorphism Utilities */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
        }

            width: 6px;
            height: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: var(--bg-border);
            border-radius: 3px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }

        select option {
            background-color: var(--bg-secondary);
            color: white;
        }

        .tooltip-arrow {
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 8px;
            height: 8px;
            background-color: #000;
            border-right: 1px solid var(--bg-border);
            border-bottom: 1px solid var(--bg-border);
        }

        .safe-area-pb {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>

                    { label: '水下攝影 (Underwater)', val: 'Underwater Photography', desc: '水下環境的攝影，呈現海洋生物與光影效果。', desc_en: 'Photography in underwater environments. Shows marine life and light effects.' },
                    { label: '空拍攝影 (Aerial/Drone)', val: 'Aerial Photography', desc: '從空中俯瞰的視角，使用無人機或飛機拍攝的鳥瞰畫面。', desc_en: 'Bird\'s eye view from above. Captured using drones or aircraft.' }
                ],
                "相機與鏡頭 (Camera & Gear)": [
                    // === 鏡頭 ===
                    { label: '廣角鏡頭 (Wide Angle)', val: 'Wide Angle Lens', desc: '視野寬廣，強調空間感與透視變形，適合風景或狹窄空間。', desc_en: 'Wide field of view. Emphasizes space and perspective. Good for landscapes/tight spaces.' },
                    { label: '超廣角 (Ultra Wide)', val: 'Ultra Wide Angle Lens', desc: '極寬視野，適合建築與壯闘風景。', desc_en: 'Extremely wide view. Great for architecture and grand landscapes.' },
                    { label: '35mm鏡頭 (35mm)', val: '35mm Lens', desc: '經典人文視角，接近人眼視覺，適合街拍。', desc_en: 'Classic humanistic perspective, close to human vision. Great for street.' },
                    { label: '50mm鏡頭 (50mm)', val: '50mm Lens', desc: '標準鏡頭，真實自然的透視感，萬用焦段。', desc_en: 'Standard lens, real and natural perspective. Versatile focal length.' },
                    { label: '85mm鏡頭 (85mm)', val: '85mm Lens', desc: '經典人像焦段，柔美的壓縮感與散景。', desc_en: 'Classic portrait focal length. Beautiful compression and bokeh.' },
                    { label: '長焦鏡頭 (Telephoto)', val: 'Telephoto Lens', desc: '壓縮空間感，使前後景看起來更貼近，背景模糊效果強。', desc_en: 'Compresses space. Makes foreground/background look closer. Strong background blur.' },
                    { label: '微距 (Macro)', val: 'Macro Photography', desc: '極近距離拍攝微小物體，展現細節世界。', desc_en: 'Extreme close-up. Reveals world of details.' },
                    // === 技術與效果 ===
                    { label: '散景 (Bokeh)', val: 'Bokeh', desc: '利用大光圈使背景模糊成柔美的光斑，突出主體。', desc_en: 'Uses large aperture to blur background into soft light spots. Highlights subject.' },
                    { label: '移軸攝影 (Tilt-Shift)', val: 'Tilt-Shift', desc: '讓真實場景看起來像微縮模型玩具。', desc_en: 'Makes real scenes look like miniature toy models.' },
                    { label: '長曝光 (Long Exposure)', val: 'Long Exposure', desc: '慢快門，讓移動的光點變光軌，流水變霧狀。', desc_en: 'Slow shutter. Turns moving lights to trails, water to mist.' },
                    { label: '高速攝影 (High Speed)', val: 'High Speed Photography', desc: '凍結高速運動瞬間，如水滴飛濺、子彈穿透。', desc_en: 'Freezes high-speed moments like water splashes or bullet penetration.' },
                    { label: '銳利對焦 (Sharp Focus)', val: 'Sharp Focus', desc: '主體清晰銳利。', desc_en: 'Subject is clear and sharp.' },
                    { label: '柔焦 (Soft Focus)', val: 'Soft Focus', desc: '輕微模糊的夢幻效果，常用於浪漫人像。', desc_en: 'Slightly blurred dreamy effect. Often used for romantic portraits.' },
                    { label: '抓拍 (Candid)', val: 'Candid', desc: '自然、不經意的瞬間捕捉。', desc_en: 'Natural, unposed moment capture.' },
                    // === 底片風格 ===
                    { label: 'Kodak Portra 400', val: 'Kodak Portra 400', desc: '膚色溫潤自然，顆粒細緻，人像首選。', desc_en: 'Warm, natural skin tones. Fine grain. Best for portraits.' },
                    { label: 'Kodak Ektar 100', val: 'Kodak Ektar 100', desc: '極高飽和度與銳利度，藍天與紅色特別鮮豔。', desc_en: 'Ultra high saturation and sharpness. Vivid blues and reds.' },
                    { label: 'Kodak Gold 200', val: 'Kodak Gold 200', desc: '經典消費級底片，溫暖金黃色調，懷舊感強。', desc_en: 'Classic consumer film. Warm golden tones. Strong nostalgic feel.' },
                    { label: 'Kodak Tri-X 400', val: 'Kodak Tri-X 400', desc: '傳奇黑白底片，高對比度，豐富的灰階層次。', desc_en: 'Legendary B&W film. High contrast with rich gray tones.' },
                    { label: 'CineStill 800T', val: 'CineStill 800T', desc: '電影底片感，燈光周圍有紅色光暈，適合夜景。', desc_en: 'Cinematic film look. Red halation around lights. Good for night scenes.' },
                    { label: 'CineStill 50D', val: 'CineStill 50D', desc: '日光電影底片，色彩飽和細膩，適合戶外。', desc_en: 'Daylight cinema film. Saturated and fine colors. Great for outdoors.' },
                    { label: 'Fujifilm Pro 400H', val: 'Fujifilm Pro 400H', desc: '日系風格，色調偏冷粉嫩，空氣感強。', desc_en: 'Japanese style. Cool, pastel tones. Airy feel.' },
                    { label: 'Fujifilm Velvia 50', val: 'Fujifilm Velvia 50', desc: '高飽和正片，風景攝影經典，色彩極為鮮豔。', desc_en: 'High saturation slide film. Landscape classic. Extremely vivid colors.' },
                    { label: 'Fujifilm Superia 400', val: 'Fujifilm Superia 400', desc: '日常消費級底片，綠色調明顯，清新自然。', desc_en: 'Everyday consumer film. Notable green tones. Fresh and natural.' },
                    { label: 'Ilford HP5 Plus', val: 'Ilford HP5 Plus', desc: '經典黑白底片，顆粒感明顯，紀實風格。', desc_en: 'Classic B&W film. Visible grain. Documentary style.' },
                    { label: 'Ilford Delta 3200', val: 'Ilford Delta 3200', desc: '超高感光黑白底片，粗顆粒與強烈對比，適合低光。', desc_en: 'Ultra high ISO B&W. Coarse grain and strong contrast. Great for low light.' },
                    { label: 'Lomography 色彩', val: 'Lomography', desc: 'Lomo 風格，高飽和、暗角、色偏與意外效果。', desc_en: 'Lomo style. High saturation, vignette, color shifts and happy accidents.' },
                    { label: '底片顆粒 (Film Grain)', val: 'Film Grain', desc: '模擬傳統底片的顆粒質感。', desc_en: 'Simulates traditional film grain texture.' },
                    { label: '交叉沖洗 (Cross Process)', val: 'Cross Processing', desc: '反轉片用負片藥水沖洗，產生奇特色彩偏移。', desc_en: 'Slide film processed in negative chemicals. Creates unusual color shifts.' },
                    { label: '拍立得 (Instant Film)', val: 'Instant Film Style', desc: 'Polaroid 風格，獨特邊框、色偏與懷舊感。', desc_en: 'Polaroid style. Unique border, color shifts, and nostalgic feel.' }
                ],
                "光影與氛圍 (Lighting & Atmosphere)": [
                    // === 自然光影時刻 ===
                    { label: '黃金時刻 (Golden Hour)', val: 'Golden Hour', desc: '日出後或日落前，光線金黃柔和。', desc_en: 'After sunrise or before sunset. Golden, soft light.' },
                    { label: '藍色時刻 (Blue Hour)', val: 'Blue Hour', desc: '日落後或日出前，天空呈現深邃冷藍色。', desc_en: 'After sunset or before sunrise. Deep cool blue sky.' },
                    { label: '自然光 (Natural Light)', val: 'Natural Light', desc: '僅使用太陽或月亮等自然光源，真實自然。', desc_en: 'Uses only natural sources like sun/moon. Authentic.' },
                    // === 打光技法 ===
                    { label: '電影光感 (Cinematic)', val: 'Cinematic Lighting', desc: '強調敘事性、情緒氛圍與高動態範圍。', desc_en: 'Emphasizes storytelling, mood, and high dynamic range.' },
                    { label: '棚拍光 (Studio Lighting)', val: 'Studio Lighting', desc: '專業攝影棚打光，光線均勻，細節清晰。', desc_en: 'Professional studio lighting. Even illumination, clear details.' },
                    { label: '遮光片 (Gobo)', val: 'Gobo Lighting', desc: '使用遮光片創造特定的光影圖案與形狀。', desc_en: 'Uses a gobo to create specific light and shadow patterns/shapes.' },
                    { label: '柔光箱 (Softbox)', val: 'Softbox Lighting', desc: '柔和、擴散的光線，減少強烈陰影，適合人像與產品。', desc_en: 'Soft, diffused light. Minimizes harsh shadows. Great for portraits/products.' },
                    { label: '環形燈 (Ring Light)', val: 'Ring Light', desc: '均勻無陰影的正面光，在眼中產生環形眼神光。', desc_en: 'Even, shadowless frontal light. Creates circular catchlights in eyes.' },
                    { label: '倫勃朗光 (Rembrandt)', val: 'Rembrandt Lighting', desc: '經典人像打光，暗部臉頰有倒三角亮區，戲劇性強。', desc_en: 'Classic portrait lighting. Triangle of light on shadowed cheek. Dramatic.' },
                    { label: '柔光 (Soft Light)', val: 'Soft Light', desc: '光質柔和均勻，陰影不明顯。', desc_en: 'Soft, even light quality. Subtle shadows.' },
                    { label: '硬光 (Hard Light)', val: 'Hard Light', desc: '光質銳利，陰影邊緣清晰明確。', desc_en: 'Sharp light quality. Clear, defined shadow edges.' },
                    { label: '逆光 (Backlighting)', val: 'Backlighting', desc: '光源在主體後方，形成剪影或邊緣光暈。', desc_en: 'Light source behind subject. Creates silhouette or rim light.' },
                    { label: '邊緣光 (Rim Light)', val: 'Rim Light', desc: '勾勒主體輪廓的光線，使主體與背景分離。', desc_en: 'Light outlining subject edges. Separates subject from background.' },
                    { label: '體積光 (Volumetric)', val: 'Volumetric Lighting', desc: '光線穿過霧氣形成的可見光束（丁達爾效應）。', desc_en: 'Visible light beams through fog (Tyndall effect).' },
                    { label: '霓虹燈 (Neon)', val: 'Neon Lights', desc: '色彩鮮豔的高飽和度發光管，賽博龐克風格。', desc_en: 'Vibrant, high-saturation tube lights. Cyberpunk style.' },
                    { label: '生物發光 (Bioluminescent)', val: 'Bioluminescent', desc: '生物體發出的冷光，神祕科技感。', desc_en: 'Cold light from organisms. Mysterious and tech-feel.' },
                    { label: '蝴蝶光 (Butterfly)', val: 'Butterfly Lighting', desc: '經典好萊塢人像光，鼻下形成蝴蝶狀陰影，美化臉型。', desc_en: 'Classic Hollywood portrait light. Butterfly shadow under nose. Flattering.' },
                    { label: '雙重曝光 (Double Exposure)', val: 'Double Exposure', desc: '重複曝光技法，將兩個畫面疊合，夢幻且超現實。', desc_en: 'Multiple exposure technique. Overlays images. Dreamy and surreal.' },
                    // === 明暗控制 ===
                    { label: '高對比 (High Contrast)', val: 'High Contrast', desc: '明暗差異極大，視覺強烈。', desc_en: 'Extreme light/dark difference. Strong visual.' },
                    { label: '低調 (Low Key)', val: 'Low Key', desc: '以暗色調為主，強調陰影與輪廓。', desc_en: 'Dark tones dominant. Emphasizes shadows and outlines.' },
                    { label: '高調 (High Key)', val: 'High Key', desc: '以亮色調為主，明亮清新無陰影。', desc_en: 'Bright tones dominant. Bright, fresh, minimal shadows.' },
                    { label: '明亮 (Bright)', val: 'Bright', desc: '充滿光線，清晰充滿希望。', desc_en: 'Full of light, clear and hopeful.' },
                    { label: '乾淨 (Clean)', val: 'Clean', desc: '畫面整潔，無雜亂元素。', desc_en: 'Neat image, no clutter.' },
                    // === 情緒氛圍 ===
                    { label: '戲劇性 (Dramatic)', val: 'Dramatic', desc: '強烈的光影對比與張力十足的氛圍。', desc_en: 'Strong light/shadow contrast and intense atmosphere.' },
                    { label: '陰鬱 (Melancholic)', val: 'Melancholic', desc: '憂鬱、沉靜的氛圍，通常色調偏冷或暗。', desc_en: 'Gloomy, quiet atmosphere. Often cool or dark tones.' },
                    { label: '夢幻 (Dreamy)', val: 'Dreamy', desc: '柔焦、粉嫩色調，像夢境一樣的感覺。', desc_en: 'Soft focus, pastel tones. Like a dream.' },
                    { label: '神祕 (Mysterious)', val: 'Mysterious', desc: '暗調、模糊或隱藏細節，引發好奇與不安。', desc_en: 'Low key, blurry, or hidden details. Provokes curiosity/unease.' },
                    { label: '療癒 (Soothing)', val: 'Soothing', desc: '色彩柔和、構圖平靜，放鬆身心。', desc_en: 'Soft colors, calm composition. Relaxing.' },
                    { label: '氛圍感 (Atmospheric)', val: 'Atmospheric', desc: '強調環境氣氛與情緒渲染。', desc_en: 'Emphasizes environmental atmosphere and mood.' },
                    // === 室內設計風格 ===
                    { label: '北歐風 (Scandinavian)', val: 'Scandinavian', desc: '溫馨明亮，木質紋理與簡約設計。', desc_en: 'Cozy, bright, wood textures, minimalist design.' },
                    { label: '工業風 (Industrial)', val: 'Industrial Style', desc: '粗獷、外露管線與金屬質感。', desc_en: 'Rough, exposed pipes, metallic texture.' },
                    { label: '禪意 (Zen)', val: 'Zen', desc: '簡約、寧靜、和諧的東方氛圍。', desc_en: 'Minimalist, peaceful, harmonious Oriental atmosphere.' },
                    { label: '極簡 (Minimalist)', val: 'Minimalist', desc: '留白多，元素少，寧靜純粹。', desc_en: 'Lots of negative space, few elements. Peaceful and pure.' }
                ],
                "色彩與色調 (Colors & Tones)": [
                    { label: '柔和粉彩 (Pastel)', val: 'Pastel Colors', desc: '低飽和度、高明度的柔和色彩，夢幻甜美。', desc_en: 'Low saturation, high brightness. Dreamy and sweet.' },
                    { label: '大地色系 (Earth Tones)', val: 'Earth Tones', desc: '源於大自然的色彩（棕、綠、卡其），沉穩舒適。', desc_en: 'Nature-inspired colors (brown, green, khaki). Stable and comfortable.' },
                    { label: '黑白單色 (Monochrome)', val: 'Monochrome', desc: '僅保留黑、白與灰階，強調光影與結構。', desc_en: 'Black, white, and grays only. Emphasizes light/shadow and structure.' },
                    { label: '復古色調 (Sepia)', val: 'Sepia', desc: '泛黃的棕褐色調，懷舊且有歷史感。', desc_en: 'Yellowish-brown tones. Nostalgic and historical.' },
                    { label: '鮮豔色彩 (Vibrant)', val: 'Vibrant Colors', desc: '高飽和度、鮮明色彩，充滿活力與能量。', desc_en: 'High saturation, vivid colors. Full of energy.' },
                    { label: '莫蘭迪色 (Morandi)', val: 'Morandi Colors', desc: '低飽和度的灰色調色彩，高級、寧靜且和諧。', desc_en: 'Low saturation greyish tones. High-end, tranquil, harmonious.' },
                    { label: '青橙色調 (Teal & Orange)', val: 'Teal and Orange', desc: '電影常用調色，冷暖對比強烈（青色陰影、橙色亮部）。', desc_en: 'Common movie grading. Strong cool/warm contrast (teal shadows, orange highlights).' },
                    { label: '冷色調 (Cool Tones)', val: 'Cool Tones', desc: '藍、青、紫色為主，冷靜、科技或憂鬱。', desc_en: 'Blue, cyan, purple dominant. Calm, tech, or melancholic.' },
                    { label: '暖色調 (Warm Tones)', val: 'Warm Tones', desc: '紅、橘、黃色為主，溫暖、熱情或舒適。', desc_en: 'Red, orange, yellow dominant. Warm, passionate, or cozy.' },
                    { label: '霓虹配色 (Neon Palette)', val: 'Neon Palette', desc: '極高亮度的螢光色，賽博龐克或夜店風格。', desc_en: 'Extremely bright fluorescent colors. Cyberpunk or club style.' },
                    { label: '大膽色彩 (Bold Colors)', val: 'Bold Colors', desc: '強烈、鮮明的色彩使用。', desc_en: 'Strong, vivid color usage.' },
                    { label: '雙色調 (Duotone)', val: 'Duotone', desc: '使用兩種對比色的調色，Spotify 海報風格。', desc_en: 'Two contrasting colors. Spotify poster style.' },
                    { label: '分割色調 (Split Toning)', val: 'Split Toning', desc: '亮部與暗部使用不同色調，電影調色技法。', desc_en: 'Different tones for highlights and shadows. Cinematic grading technique.' },
                    { label: '消色差 (Desaturated)', val: 'Desaturated', desc: '低飽和度灰調，安靜沉穩的視覺效果。', desc_en: 'Low saturation gray tones. Quiet and calm visual effect.' },
                    { label: '彩虹 (Rainbow)', val: 'Rainbow Colors', desc: '多彩漸層，充滿活力與多元性。', desc_en: 'Colorful gradient. Full of vitality and diversity.' }
                ],
                "材質與質感 (Materials & Textures)": [
                    { label: '玻璃 (Glass)', val: 'Glass', desc: '透明、反光、折射，清澈易碎。', desc_en: 'Transparent, reflective, refractive. Clear and fragile.' },
                    { label: '金屬 (Metal)', val: 'Metal', desc: '硬朗、反光、冷質感，工業堅固。', desc_en: 'Hard, reflective, cold. Industrial and sturdy.' },
                    { label: '木頭 (Wood)', val: 'Wood', desc: '溫暖自然的紋理，質樸舒適。', desc_en: 'Warm natural grain. Rustic and comfortable.' },
                    { label: '大理石 (Marble)', val: 'Marble', desc: '高雅石材紋路，光滑冰冷，奢華感。', desc_en: 'Elegant stone pattern. Smooth, cold, luxurious.' },
                    { label: '布料 (Fabric)', val: 'Fabric', desc: '柔軟纖維質感，編織紋理與垂墜感。', desc_en: 'Soft fiber texture. Weave patterns and drape.' },
                    { label: '皮革 (Leather)', val: 'Leather', desc: '毛孔紋理與自然光澤，經典耐用。', desc_en: 'Pore texture and natural sheen. Classic and durable.' },
                    { label: '塑膠 (Plastic)', val: 'Plastic', desc: '光滑人造，色彩飽和，反光生硬。', desc_en: 'Smooth artificial. Saturated colors, harsh reflections.' },
                    { label: '水 (Water)', val: 'Water', desc: '流動透明液體，波紋或倒影。', desc_en: 'Fluid transparent liquid. Ripples or reflections.' },
                    { label: '冰 (Ice)', val: 'Ice', desc: '晶瑩剔透寒冷，氣泡與裂紋。', desc_en: 'Crystal clear cold. Bubbles and cracks.' },
                    { label: '煙霧 (Smoke)', val: 'Smoke', desc: '飄渺無定形氣體，半透明神祕。', desc_en: 'Ethereal amorphous gas. Translucent and mysterious.' },
                    { label: '筆記本紙 (Notebook Paper)', val: 'Notebook Paper', desc: '筆記本紙張紋理。', desc_en: 'Notebook paper texture.' },
                    { label: '質感 (Texture)', val: 'Texture', desc: '強調表面細節與觸感。', desc_en: 'Emphasizes surface details and tactile feel.' },
                    { label: '反光 (Reflection)', val: 'Reflection', desc: '物體表面的反射效果。', desc_en: 'Reflection effect on object surface.' },
                    { label: '陶瓷 (Ceramic)', val: 'Ceramic', desc: '光滑釉面光澤，手工藝質感。', desc_en: 'Smooth glazed surface. Artisanal craftsmanship feel.' },
                    { label: '混凝土 (Concrete)', val: 'Concrete', desc: '粗獷工業質感，現代極簡建築風格。', desc_en: 'Rough industrial texture. Modern minimalist architecture.' },
                    { label: '紙張 (Paper)', val: 'Paper Texture', desc: '各式紙質紋理，從牛皮紙到美術紙。', desc_en: 'Various paper textures, from kraft to fine art paper.' },
                    { label: '絲絨 (Velvet)', val: 'Velvet', desc: '柔軟絨毛質感，奢華高貴。', desc_en: 'Soft plush texture. Luxurious and elegant.' },
                    { label: '霧面 (Matte)', val: 'Matte Finish', desc: '無反光表面，柔和不刺眼。', desc_en: 'Non-reflective surface. Soft and non-glaring.' },
                    { label: '珍珠光澤 (Pearlescent)', val: 'Pearlescent', desc: '虹彩變色效果，夢幻高級感。', desc_en: 'Iridescent color-shifting effect. Dreamy and premium.' },
                    { label: '氧化銅綠 (Patina)', val: 'Patina', desc: '銅器氧化後的綠色，歲月與歷史感。', desc_en: 'Oxidized copper green. Aged and historical feel.' },
                    { label: '樹脂 (Resin)', val: 'Resin', desc: '透明或半透明膠質，可封存物體。', desc_en: 'Transparent or translucent gel. Can encapsulate objects.' },
                    { label: '金箔 (Gold Foil)', val: 'Gold Foil', desc: '閃亮的金屬箔片質感，奢華燙金效果。', desc_en: 'Shiny metallic foil texture. Luxurious gilded effect.' },
                    { label: '全息 (Holographic)', val: 'Holographic', desc: '彩虹光澤的全息材質，科技感十足。', desc_en: 'Rainbow-sheen holographic material. High-tech feel.' }
                ],                "設計排版 (Design Layout)": [
                    { label: '平鋪 (Knolling)', val: 'Knolling', desc: '物體平行或90度整齊排列，井然有序。', desc_en: 'Objects arranged parallel or at 90 degrees. Orderly.' },

                        if (token.startsWith('--')) {

                        } else if (token.includes('::')) {
                            return <span key={i} className="text-pink-400 font-bold">{token}</span>;
                        } else if (!isNaN(parseFloat(token)) && isFinite(token)) {
                            return <span key={i} className="text-blue-700 dark:text-blue-300">{token}</span>;
                        } else if (token.match(/^https?:\/\//)) {

 // 'zh' or 'en'

const [showPresetModal, setShowPresetModal] = useState(false);

                        const validatePresetPayload = (data) => {
                const errors = [];
                if (typeof data !== 'object' || data === null || Array.isArray(data)) {
                    return { ok: false, errors: ['匯入資料必須是 JSON 物件 (頂層不可為 array)'] };
                }
                const groups = Object.keys(data);
                if (groups.length > 50) errors.push(`群組數量超過上限 (50)，目前: ${groups.length}`);
                
                const validKeys = new Set(['name', 'desc', 'desc_en', 'subject', 'title', 'body', 'styles', 'sections', 'ar', 'resolution', 'texture', 'quality']);
                let totalStrLen = JSON.stringify(data).length;
                if (totalStrLen > 2 * 1024 * 1024) errors.push(`檔案大小超過上限 (2MB)`);

                for (const groupName of groups) {
                    const group = data[groupName];
                    if (typeof group !== 'object' || group === null || Array.isArray(group)) {
                        errors.push(`群組「${groupName}」：值必須是物件`);
                        continue;
                    }
                    const presetKeys = Object.keys(group);
                    if (presetKeys.length > 200) errors.push(`群組「${groupName}」：預設數量超過上限 (200)，目前: ${presetKeys.length}`);
                    
                    for (const key of presetKeys) {
                        const preset = group[key];
                        if (typeof preset !== 'object' || preset === null || Array.isArray(preset)) {
                            errors.push(`群組「${groupName}」的「${key}」：必須是物件`);
                            continue;
                        }
                        
                        // Check keys
                        for (const k of Object.keys(preset)) {
                            if (!validKeys.has(k)) {
                                errors.push(`群組「${groupName}」的「${key}」：包含未知鍵「${k}」 (已剔除)`);
                                delete preset[k];
                            } else if (typeof preset[k] === 'string' && preset[k].length > 5000) {
                                errors.push(`群組「${groupName}」的「${key}」：欄位 ${k} 字元數超過上限 (5000)`);
                            }
                        }
                        
                        if (!Array.isArray(preset.styles)) {
                            errors.push(`群組「${groupName}」的「${key}」：欄位 styles 應為陣列，實得 ${typeof preset.styles}`);
                        } else if (!preset.styles.every(s => typeof s === 'string')) {
                            errors.push(`群組「${groupName}」的「${key}」：欄位 styles 必須是字串陣列`);
                        }
                        
                        if (!Array.isArray(preset.sections)) {
                            errors.push(`群組「${groupName}」的「${key}」：欄位 sections 應為陣列，實得 ${typeof preset.sections}`);

                                                >
                                                    <Trash2 size={12} /> {t('清空全部', 'Clear All')}
                                                </button>
                                            </div>
                                            {history.map((item) => (
                                                <div key={item.id} className="bg-stone-200 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg p-3 hover:border-gray-500 transition group">
                                                    <div className="flex justify-between items-start mb-2">
                                                        <div>
                                                            <div className="text-xs text-gray-600 dark:text-gray-400 mb-1">{new Date(item.timestamp).toLocaleString()}</div>
                                                            <div className="text-sm font-bold text-stone-800 dark:text-white line-clamp-1">{item.form.subject || t('未命名', 'Untitled')}</div>
                                                        </div>
                                                        <div className="flex gap-2">
                                                            <button
                                                                onClick={() => navigator.clipboard.writeText(item.prompt)}
                                                                className="text-gray-500 hover:text-green-600 dark:text-green-400 p-1"
                                                                title={t('複製', 'Copy')}
                                                            >
                                                                <Copy size={16} />
                                                            </button>
                                                            <button
                                                                onClick={() => {
                                                                    if (confirm(t('確定要載入此記錄嗎？目前的設定將被覆蓋。', 'Load this record? Current settings will be overwritten.'))) {
                                                                        restoreFromHistory(item);
                                                                    }
                                                                }}
                                                                className="text-blue-600 dark:text-blue-400 hover:text-blue-700 dark:text-blue-300 p-1"
                                                                title={t('載入', 'Load')}
                                                            >
                                                                <Upload size={16} />
                                                            </button>
                                                            <button
                                                                onClick={() => {
                                                                    if (confirm(t('確定要刪除此記錄嗎？', 'Delete this record?'))) {
                                                                        deleteHistoryItem(item.id);
                                                                    }
                                                                }}
                                                                className="text-gray-500 hover:text-red-600 dark:text-red-400 p-1"
                                                                title={t('刪除', 'Delete')}
                                                            >
                                                                <X size={16} />
                                                            </button>
                                                        </div>
                                                    </div>
                                                    <div className="bg-stone-100 dark:bg-gray-900 p-2 rounded border border-gray-300 dark:border-gray-700/50">
                                                        <SyntaxHighlightedPrompt text={item.prompt} />
                                                    </div>
                                                </div>
                                            ))}
                                        </>

                                    )}
                                </div>
                            )}
                        </div>


                    </div>

                    {/* MOBILE BOTTOM NAVIGATION BAR */}
                    <div className="lg:hidden fixed bottom-0 left-0 right-0 glass border-t border-slate-300 dark:border-slate-700/50 z-50 flex h-16 safe-area-pb">
                        <button
                            onClick={() => setActiveMobileTab('edit')}
                            className={`flex-1 flex flex-col items-center justify-center gap-1 transition-colors duration-200
                                ${activeMobileTab === 'edit' ? 'text-blue-600 dark:text-blue-400 bg-stone-200 dark:bg-gray-800' : 'text-gray-500 hover:text-gray-700 dark:text-gray-300 hover:bg-stone-200 dark:bg-gray-800/50'}`}
                        >
                            <Edit3 size={20} />
                            <span className="text-[10px] font-bold">編輯 (Editor)</span>
                        </button>
                        <button
                            onClick={() => setActiveMobileTab('preview')}
                            className={`flex-1 flex flex-col items-center justify-center gap-1 transition-colors duration-200
                                ${activeMobileTab === 'preview' ? 'text-yellow-600 dark:text-yellow-400 bg-stone-200 dark:bg-gray-800' : 'text-gray-500 hover:text-gray-700 dark:text-gray-300 hover:bg-stone-200 dark:bg-gray-800/50'}`}
                        >
                            <Eye size={20} />
                            <span className="text-[10px] font-bold">預覽 (Preview)</span>
                        </button>
                    </div>
                </div >
            );
        };

        const rootElement = document.getElementById('root');
        if (!rootElement) {
            throw new Error("Could not find root element to mount to");
        }

        const root = createRoot(rootElement);
        root.render(
            <React.StrictMode>
                <App />
            </React.StrictMode>
        );
    </script>
</body>

</html>
